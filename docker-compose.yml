services:
  escpos-emulator:
    build: .
    image: escpos-emulator-web:latest
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-prod}
      ADVERTISE_HOST: ${ADVERTISE_HOST:-}
      HOST: ${HOST:-0.0.0.0}
      HTTP_PORT: ${HTTP_PORT:-3000}
      TCP_PORT: ${TCP_PORT:-9100}
      TCP_HOST_PORT: ${TCP_HOST_PORT:-9100}
    expose:
      - "${HTTP_PORT:-3000}"
    ports:
      - "${TCP_HOST_PORT:-9100}:${TCP_PORT:-9100}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${HTTP_PORT:-3000}/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
